<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinema Showtimes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Cinema Showtimes</h1>
    <p>Add, edit and remove screenings. Every change is saved through the REST API.</p>
  </header>

  <main>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Add a showtime</h2>
      <form id="showtime-form">
        <input type="hidden" id="id" />
        <label>Movie title
          <input id="movie_title" required maxlength="200" placeholder="e.g. Dune: Part Two" />
        </label>
        <label>Genre
          <select id="genre">
            <option value="">Select genre</option>
            <option>Action</option><option>Adventure</option><option>Animation</option>
            <option>Comedy</option><option>Drama</option><option>Family</option>
            <option>Horror</option><option>Sci-Fi</option><option>Thriller</option>
          </select>
        </label>
        <label>Hall
          <input id="hall" placeholder="e.g. Hall 1" />
        </label>
        <label>Date
          <input id="show_date" type="date" />
        </label>
        <label>Time
          <input id="show_time" type="time" />
        </label>
        <label>Ticket price (ZMW)
          <input id="ticket_price" type="number" min="0" step="0.01" value="0" />
        </label>
        <label>Available seats
          <input id="available_seats" type="number" min="0" step="1" value="0" />
        </label>
        <div class="actions">
          <button type="submit" class="primary" id="save-btn">Add showtime</button>
          <button type="button" class="ghost" id="cancel-btn" hidden>Cancel edit</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">All showtimes</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Movie</th><th>Genre</th><th>Hall</th><th>Date</th>
              <th>Time</th><th>Price (ZMW)</th><th>Seats</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No showtimes yet. Add one using the form above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
